openapi: 3.0.3
info:
  title: Employee Management API
  description: >
    REST API for the Week 3-6 laboratory activities of PFEBSIT 002 -
    Integrative Programming 2, Module 1 (Foundations of Systems Integration
    and Laravel REST API Development).
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:8000/api
    description: Local development server (Laravel artisan serve)

tags:
  - name: Students
    description: Week 2 - static demo endpoint
  - name: Auth
    description: Week 6 - registration, login, logout (Laravel Sanctum)
  - name: Employees
    description: Week 4-5 - CRUD, relationships, pagination, filtering, searching

paths:
  /students:
    get:
      tags: [Students]
      summary: List demo students (Week 2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /register:
    post:
      tags: [Auth]
      summary: Register a new user and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          description: Validation error

  /login:
    post:
      tags: [Auth]
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid login credentials

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Logged out successfully
        "401":
          description: Unauthenticated

  /employees:
    get:
      tags: [Employees]
      summary: List employees (search, filter, paginate)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Matches first_name, last_name, or email
        - in: query
          name: department_id
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Paginated list of employees
        "401":
          description: Unauthenticated
    post:
      tags: [Employees]
      summary: Create an employee
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "422":
          description: Validation error

  /employees/{id}:
    get:
      tags: [Employees]
      summary: Get one employee
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
    put:
      tags: [Employees]
      summary: Update an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: Updated
        "404":
          description: Employee not found
        "422":
          description: Validation error
    delete:
      tags: [Employees]
      summary: Delete an employee
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Deleted
        "404":
          description: Employee not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum personal access token"

  parameters:
    EmployeeId:
      in: path
      name: id
      required: true
      schema: { type: integer }

  schemas:
    Student:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        course: { type: string }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        message: { type: string }
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }

    EmployeeInput:
      type: object
      required: [first_name, last_name, email, department_id, position]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        department_id: { type: integer }
        position: { type: string, maxLength: 100 }

    Employee:
      allOf:
        - $ref: "#/components/schemas/EmployeeInput"
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
